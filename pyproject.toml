[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "detecter"
version = "0.1.0"
description = "Minimal C2PA and UniversalFakeDetect image inspection spike"
requires-python = ">=3.11,<3.12"
license-files = ["LICENSES/*.txt"]
dependencies = [
  "c2pa-python==0.37.10",
  "cryptography>=41,<47",
  "ftfy>=6,<7",
  "numpy<2",
  "Pillow>=10,<12",
  "regex>=2024.5.15",
  "setuptools>=68,<81",
  "torch==2.2.2",
  "torchvision==0.17.2",
  "tqdm>=4.66,<5",
  "typesafe-sdk==0.7.1",
]

[dependency-groups]
dev = [
  "pre-commit>=4,<5",
  "ruff>=0.9,<1",
]

[project.optional-dependencies]
community-forensics = ["timm==1.0.15", "safetensors==0.5.3"]
cure = [
  "albumentations==2.0.8",
  "huggingface_hub>=0.23",
  "opencv-python-headless>=4.9,<6",
]

[project.scripts]
detecter = "detecter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
